<h2 id="7-国内平台合规提示词"><span class="chapter-kicker">CHAPTER · 07</span><a class="anchor" href="#7-国内平台合规提示词" aria-label="定位到本节">#</a>7. 国内平台合规提示词</h2>
<div class="codebox"><div class="codebar"><span>text</span><button class="copy-btn" type="button">复制</button></div><pre><code>请写一章“国内电商平台用AI图会不会被处罚”。

覆盖：淘宝、天猫、京东、拼多多、抖音电商、小红书电商。

请谨慎回答：
- 不要编造平台政策。
- 如果平台没有明确禁止AI图，要说明核心风险通常不是“AI生成”，而是虚假宣传、商品不一致、侵权、低质素材和违规营销。

必须写：
1. 哪些AI图风险高
2. 主图怎么用更安全
3. 详情页怎么用更安全
4. 种草图怎么用更安全
5. 人工审核清单
6. 封链接/处罚风险怎么理解

要求：
- 语言务实，不制造恐慌。
- 强调产品真实性。
</code></pre></div>
